[project]
name = "flowcast"
version = "0.1.0"
description = "Predicts airflow in ventilated rooms and recommends the lowest safe fan setting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
# Install torch from the PyTorch index that matches the machine (cpu, or rocm for AMD GPUs)
model = ["torch>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flowcast"]
